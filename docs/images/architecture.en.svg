<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">One headless server, two ways to use it</title>
  <desc id="desc">Terminal and browser connect to AlterEcho Server. Only the server owns conversations, memory, persistence and the Codex CLI, Ollama, OpenAI API and OpenRouter API providers.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#919baa" stroke-width="1.6"/></marker></defs>
  <rect x="1" y="1" width="898" height="648" rx="20" fill="#101319" stroke="#2a313b" stroke-width="2"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="450" y="52" fill="#919baa" font-size="15" letter-spacing="2">ALTERECHO ARCHITECTURE</text>
    <rect x="55" y="86" width="365" height="106" rx="12" fill="#181d25" stroke="#2a313b"/>
    <rect x="480" y="86" width="365" height="106" rx="12" fill="#181d25" stroke="#2a313b"/>
    <text x="237" y="131" fill="#e5e9f0" font-size="30">Terminal</text>
    <text x="237" y="166" fill="#919baa" font-size="20">CLI client</text>
    <text x="662" y="131" fill="#e5e9f0" font-size="30">Browser</text>
    <text x="662" y="166" fill="#919baa" font-size="20">Web UI</text>
    <path d="M237 203v29q0 12 12 12h131v30" fill="none" stroke="#919baa" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M662 203v29q0 12-12 12H520v30" fill="none" stroke="#919baa" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="190" y="290" width="520" height="146" rx="14" fill="#152925" stroke="#80ddcf" stroke-opacity=".7" stroke-width="1.5"/>
    <text x="450" y="337" fill="#80ddcf" font-size="33" font-weight="600">AlterEcho Server</text>
    <text x="450" y="372" fill="#e5e9f0" font-size="23">One headless process</text>
    <text x="450" y="408" fill="#a9bdb8" font-size="19">Conversations · memory · persistence</text>
    <path d="M450 448v58M130 506h640M130 506v25M343 506v25M557 506v25M770 506v25" fill="none" stroke="#919baa" stroke-width="2"/>
    <rect x="35" y="537" width="190" height="70" rx="10" fill="#181d25" stroke="#2a313b"/>
    <rect x="248" y="537" width="190" height="70" rx="10" fill="#181d25" stroke="#2a313b"/>
    <rect x="462" y="537" width="190" height="70" rx="10" fill="#181d25" stroke="#2a313b"/>
    <rect x="675" y="537" width="190" height="70" rx="10" fill="#181d25" stroke="#2a313b"/>
    <text x="130" y="580" fill="#e5e9f0" font-size="22">Codex CLI</text>
    <text x="343" y="580" fill="#e5e9f0" font-size="22">Ollama</text>
    <text x="557" y="580" fill="#e5e9f0" font-size="22">OpenAI API</text>
    <text x="770" y="580" fill="#e5e9f0" font-size="21">OpenRouter API</text>
  </g>
</svg>
