# Catalogo Codex: python -m alterecho doctor. Lascia vuoto per selezione interattiva.
codex_model = ""
codex_binary = "codex"
codex_home = ""
codex_effort = "low"
ollama_model = "qwen3.5:9b"
ollama_url = "http://localhost:11434"
ollama_keep_alive = -1 # -1 senza scadenza, "10m", "5m", 0 dopo ogni risposta
ollama_unload_on_exit = true # richiesta prudente: nessuno scaricamento se l'uso esclusivo non è verificabile
topic = "La tecnologia rende le persone più autonome?"
mode = "free" # free, debate, blind
first = "codex"
max_turns = 10 # messaggi totali: 10 = 5 risposte ciascuno
delay = 1.0
timeout = 180.0
num_ctx = 4096 # token Ollama; aumenta esplicitamente per dialoghi più lunghi (più memoria)
num_predict = 512
temperature = 0.7
api_max_output_tokens = 512 # usato soltanto dagli adapter API opzionali
# output_dir omesso: Documenti/AlterEcho/conversations (cartella nativa del sistema)

[roles]
codex = "Curioso, concreto, disponibile a rivedere le proprie idee."
ollama = "Riflessivo, propone esempi e domande."

[positions]
codex = "Sostieni inizialmente che la tecnologia aumenta l'autonomia."
ollama = "Sostieni inizialmente che la tecnologia crea nuove dipendenze."

[ollama_options]
top_p = 0.9
