name: Versioned release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
# Glob is only a prefilter. validate strictly checks SemVer and event.created.
permissions:
  contents: read
concurrency:
  group: alterecho-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      python_version: ${{ steps.version.outputs.python_version }}
      docker_version: ${{ steps.version.outputs.docker_version }}
      commit: ${{ steps.version.outputs.commit }}
      image: ${{ steps.version.outputs.image }}
      codex_version: ${{ steps.version.outputs.codex_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: python -m pip install 'packaging>=24,<27'
      - name: New tag, coherent versions, immutable target and no existing release
        id: version
        run: python deploy/release.py validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  tests:
    needs: validate
    uses: ./.github/workflows/test.yml
    permissions: {contents: read}
  frontend:
    needs: [validate, tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.validate.outputs.commit }}', persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: release-web, path: alterecho/static/, if-no-files-found: error, retention-days: 3}
  python:
    needs: [validate, frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.validate.outputs.commit }}', persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Replace committed static files with verified build
        run: python -c "from pathlib import Path; import shutil; root=Path.cwd().resolve(); target=(root/'alterecho/static').resolve(); assert target.is_relative_to(root) and target.parent==root/'alterecho'; shutil.rmtree(target)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: release-web, path: alterecho/static/}
      - run: python -m pip install build 'packaging>=24,<27'
      - run: python -m build
      - name: Inspect archives and install wheel plus sdist in fresh environments
        run: python deploy/check-package.py --clean-install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3
  standalone:
    needs: [validate, python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: windows-x64, arch: x64, executable: dist/alterecho.exe}
          - {os: ubuntu-22.04, target: linux-x64, arch: x64, executable: dist/alterecho}
          - {os: ubuntu-22.04-arm, target: linux-arm64, arch: arm64, executable: dist/alterecho}
          - {os: macos-15, target: macos-arm64, arch: arm64, executable: dist/alterecho}
          - {os: macos-15-intel, target: macos-x64, arch: x64, executable: dist/alterecho}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.validate.outputs.commit }}', persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12', architecture: '${{ matrix.arch }}'}
      - name: Assert native architecture
        run: python -c "import os,platform; expected=os.environ['EXPECTED_ARCH']; actual=platform.machine().lower(); assert actual in ({'x64':{'amd64','x86_64'},'arm64':{'arm64','aarch64'}}[expected]), (expected,actual)"
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - run: python -c "from pathlib import Path; import shutil; root=Path.cwd().resolve(); target=(root/'alterecho/static').resolve(); assert target.is_relative_to(root) and target.parent==root/'alterecho'; shutil.rmtree(target)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: release-web, path: alterecho/static/}
      - name: Linux native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils
      - run: python -m pip install '.[standalone]' 'packaging>=24,<27'
      - run: python -m PyInstaller --noconfirm deploy/alterecho.spec
      - name: Real executable outside checkout; mock demo only
        run: python deploy/check-standalone.py "${{ matrix.executable }}"
      - name: Archive only this verified platform
        run: python deploy/release.py archive --executable "$EXECUTABLE" --target "$TARGET" --tag "$VERSION_TAG" --directory release-assets
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
          TARGET: ${{ matrix.target }}
          VERSION_TAG: ${{ needs.validate.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: 'release-assets-${{ matrix.target }}', path: 'release-assets/*', if-no-files-found: error, retention-days: 3}
  docker-build:
    needs: [validate, standalone]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, arch: amd64}
          - {os: ubuntu-22.04-arm, arch: arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.validate.outputs.commit }}', persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Native build, local load only
        shell: bash
        run: |
          docker buildx build --platform "linux/$ARCH" --load --tag "alterecho:release-$ARCH" \
            --build-arg "CODEX_VERSION=$CODEX_VERSION" --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$COMMIT" --build-arg "SOURCE=https://github.com/$GITHUB_REPOSITORY" .
      - name: Check image, Codex binary, headless HTTP, persistence and SIGTERM
        run: python deploy/check-image.py --architecture "$ARCH" --version "$VERSION" --commit "$COMMIT" --output "docker-artifacts/$ARCH"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: 'release-docker-${{ matrix.arch }}', path: docker-artifacts/, compression-level: 0, if-no-files-found: error, retention-days: 3}
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      CODEX_VERSION: ${{ needs.validate.outputs.codex_version }}
  docker-publish:
    needs: [validate, docker-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.validate.outputs.commit }}', persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: python -m pip install 'packaging>=24,<27'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: 'release-docker-*', merge-multiple: true, path: docker-artifacts/}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing version; publish only two tested image archives
        id: publish
        shell: bash
        run: python deploy/release.py publish-docker --tag "$VERSION_TAG" --image "$IMAGE" --commit "$COMMIT" --directory docker-artifacts
        env:
          VERSION_TAG: ${{ needs.validate.outputs.tag }}
          IMAGE: ${{ needs.validate.outputs.image }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    needs: [validate, docker-publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.validate.outputs.commit }}', persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: python -m pip install 'packaging>=24,<27'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: 'release-assets-*', merge-multiple: true, path: release-assets/}
      - name: Exact asset set and SHA-256 manifest
        run: python deploy/release.py bundle --tag "$VERSION_TAG" --commit "$COMMIT" --digest "$DIGEST" --directory release-assets
      - name: Create draft, verify all uploaded assets, then publish
        run: python deploy/release.py publish-release --tag "$VERSION_TAG" --commit "$COMMIT" --directory release-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    env:
      VERSION_TAG: ${{ needs.validate.outputs.tag }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      DIGEST: ${{ needs.docker-publish.outputs.digest }}
