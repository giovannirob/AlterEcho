name: Headless platform
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run check && npm test && npm run build
        working-directory: web
      - name: Isolated Python environment
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - run: python -m pip install '.[server]' build
      - run: python -m unittest discover -v
        env:
          ALTERECHO_HOME: ${{ runner.temp }}/alterecho-tests
          OPENAI_API_KEY: ''
          OPENROUTER_API_KEY: ''
      - run: python -m build
      - run: python deploy/check-package.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t alterecho:test .
      - name: Headless runtime and persistence without inference
        run: |
          docker volume create ae-test
          docker run -d --name ae -p 127.0.0.1:8765:8765 -v ae-test:/var/lib/alterecho -e ALTERECHO_TOKEN=fixture-token-with-at-least-32-characters alterecho:test
          python deploy/docker-smoke.py
          docker stop --time 45 ae
          docker start ae
          python deploy/docker-smoke.py --check-persisted
          docker rm -f ae
          docker volume rm ae-test
