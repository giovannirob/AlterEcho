[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alterecho"
version = "0.2.0"
description = "Conversazione locale fra Codex e Ollama"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "rich>=13.7,<15"]

[project.scripts]
alterecho = "alterecho.cli:main"
ai-bridge = "alterecho.cli:main"

[tool.setuptools.packages.find]
include = ["alterecho*", "ai_bridge*"]
