[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alterecho"
version = "1.1.0"
description = "Piattaforma headless con API, client CLI e Web UI per dialoghi tra modelli"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "rich>=13.7,<15", "markdown-it-py>=3,<5", "Pygments>=2.17,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]
dev = ["alterecho[server]", "build>=1,<2", "packaging>=24,<27", "PyYAML>=6,<7"]
standalone = ["alterecho[server]", "pyinstaller>=6.9,<7"]

[project.scripts]
alterecho = "alterecho.cli:main"

[tool.setuptools.packages.find]
include = ["alterecho*"]

[tool.setuptools.package-data]
"alterecho.exporters" = ["templates/*.html", "templates/*.css", "templates/*.js"]
"alterecho" = ["static/index.html", "static/assets/*"]
