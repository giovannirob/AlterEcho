[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bridge-local"
version = "0.1.0"
description = "Conversazione locale fra Codex e Ollama"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "rich>=13.7,<15"]

[project.scripts]
ai-bridge = "ai_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["ai_bridge*"]
